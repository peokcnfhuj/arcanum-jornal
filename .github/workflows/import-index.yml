name: Importar index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar o arquivo da release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0 --pattern "arcanum-jornal.html" --dir /tmp/arcanum
          cp /tmp/arcanum/arcanum-jornal.html index.html
          ls -lh index.html
      - name: Commitar index.html
        run: |
          git config user.name "peokcnfhuj"
          git config user.email "peokcnfhuj@users.noreply.github.com"
          git add index.html
          git commit -m "Adicionar index.html do Arcanum Jornal"
          git push
